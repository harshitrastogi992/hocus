[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hocus"
version = "0.1.0"
description = "Gesture-driven webcam effects engine for the Hocus desktop app"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    # 1.0.x crashes on Apple Silicon when creating hand/face landmarkers
    # ("graph_service.h: Service is unavailable").
    "mediapipe==1.1.1",
    "opencv-python>=4.10,<6",
    "numpy>=2.0,<3",
    "pyvirtualcam>=0.15,<1",
    "websockets>=13,<16",
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10"]

[project.scripts]
hocus-engine = "hocus.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hocus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["hocus", "hands"]
